server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ponytail: SPA only, no API proxy. frontend calls the backend host directly.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}